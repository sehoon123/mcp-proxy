name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/streamable-http-proxy]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          validate-wrappers: true

      - name: Run tests
        run: ./gradlew test

      - name: Build proxy JAR and component report
        run: ./gradlew shadowJar writeRuntimeComponents

      - name: Verify reproducible proxy JAR
        shell: bash
        run: |
          cp build/libs/mcp-proxy-all.jar "$RUNNER_TEMP/mcp-proxy-first.jar"
          ./gradlew shadowJar --rerun-tasks
          cmp "$RUNNER_TEMP/mcp-proxy-first.jar" build/libs/mcp-proxy-all.jar

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 7

      - name: Upload proxy JAR
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: mcp-proxy
          path: |
            build/libs/mcp-proxy-all.jar
            build/reports/runtime-components.txt
            LICENSE
            NOTICE.md
            FORK_NOTICE.md
            THIRD_PARTY_NOTICES.md
            CORRESPONDING_SOURCE.md
            legal/licenses/
          if-no-files-found: error
          retention-days: 30
